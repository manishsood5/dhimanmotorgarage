name: DhimanMotorGarage
options:
  bundleIdPrefix: in.dhimanmotorgarage
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

schemes:
  DhimanMotorGarage:
    build:
      targets:
        DhimanMotorGarage: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  OneSignal-iOS-SDK:
    url: https://github.com/OneSignal/OneSignal-iOS-SDK
    from: "5.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.1
    DEVELOPMENT_TEAM: LF96H2J9VK

targets:
  DhimanMotorGarage:
    type: application
    platform: iOS
    sources:
      - path: DhimanMotorGarage
    dependencies:
      - package: OneSignal-iOS-SDK
        product: OneSignalFramework
      - package: OneSignal-iOS-SDK
        product: OneSignalExtension
      - package: OneSignal-iOS-SDK
        product: OneSignalInAppMessages
      - package: OneSignal-iOS-SDK
        product: OneSignalLocation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.dhimanmotorgarage.app
        INFOPLIST_FILE: DhimanMotorGarage/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: "Dhiman Motor Garage"
        CODE_SIGN_ENTITLEMENTS: DhimanMotorGarage/DhimanMotorGarage.entitlements
    info:
      path: DhimanMotorGarage/Info.plist
      properties:
        CFBundleDisplayName: Dhiman Motor Garage
        CFBundleName: Dhiman Motor Garage
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        LSApplicationQueriesSchemes:
          - tel
          - telprompt
          - mailto
          - sms
          - comgooglemaps
          - whatsapp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSCameraUsageDescription: "Dhiman Motor Garage uses your camera so you can photograph your vehicle or its parts when submitting a service request. For example, you can capture an image of a damaged component or your vehicle's current condition so our technicians can review it before your appointment."
        NSLocationWhenInUseUsageDescription: "Dhiman Motor Garage uses your location to show nearby service centers, estimate pickup distance, and autofill your address when booking a vehicle service appointment."
        NSPhotoLibraryUsageDescription: "Dhiman Motor Garage accesses your photo library so you can attach images of your vehicle or damaged parts when submitting a service request, helping our technicians prepare before your appointment."
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UIViewControllerBasedStatusBarAppearance: false
